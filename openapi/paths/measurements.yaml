# POST /measurements
ingestion:
  post:
    tags:
      - Mesures
    operationId: ingestMeasurements
    summary:
      Enregistrer les mesures envoyées par les montres connectées pour assurer le suivi des
      patients.
    description:
      Le simulateur transmet un lot pour le patient indiqué par patientId ;
      Scope montre requis (403 sinon). Si le patient est inexistant ou n’est pas rattaché à
      l’émetteur authentifié, la réponse est 404 (BOLA en écriture) ; patientId seul n’autorise pas l’envoi.
      Un relevé invalide entraîne le rejet complet du lot ; l’enregistrement est atomique.
      Tout batchId existant entraîne 409, contenu identique ou différent.
      L’évaluation des seuils suit l’enregistrement dans le parcours décrit ;
      l’ordre technique et ses garanties restent à valider.
    x-caller: simulateur
    security:
      - bearerAuth: [montre]
    responses:
      "201":
        description: Le lot a été validé et enregistré avec toutes ses mesures dans une transaction.
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/BatchReceipt"
        headers:
          Location:
            description:
              URI du lot créé. Convention non définie dans les documents ; aucune route de
              consultation des lots n’est ajoutée.
            required: true
            schema:
              type: string
              format: uri-reference
            x-pending-decision: Définir l’URI canonique du lot créé pour renseigner Location.
      "400":
        description:
          Les données du lot sont invalides ; un seul relevé invalide entraîne le rejet du lot
          entier.
        content:
          application/problem+json:
            schema:
              $ref: "../components/schemas.yaml#/Problem"
            examples:
              erreur:
                $ref: "../components/examples.yaml#/BadRequest"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses.yaml#/Forbidden"
      "404":
        $ref: "../components/responses.yaml#/PatientNotFound"
      "409":
        description:
          Le `batchId` a déjà été utilisé, que le contenu soit identique ou différent ; aucune
          nouvelle mesure n’est enregistrée.
        content:
          application/problem+json:
            schema:
              $ref: "../components/schemas.yaml#/Problem"
            examples:
              erreur:
                $ref: "../components/examples.yaml#/Conflict"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/schemas.yaml#/MeasurementBatch"
          example:
            patientId: patient-001
            batchId: lot-001
            measurements:
              - horodatage: "2026-11-19T10:00:00Z"
                frequenceCardiaque: 75
                spo2: 98
                pas: 120

# GET /patients/{patientId}/measurements
patientMeasurements:
  get:
    tags:
      - Mesures
    operationId: listPatientMeasurements
    summary: Récupérer les mesures d’un patient sur une période donnée pour suivre leur évolution.
    description:
      Scope soignant requis (403 sinon). Le patient doit exister, être suivi par le soignant et
      avoir donné un consentement valide ; sinon 404, sans distinguer les cas (BOLA).
    x-caller: soignant
    security:
      - bearerAuth: [soignant]
    responses:
      "200":
        description: Les mesures du patient correspondant à la période et à la page demandées sont récupérées.
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/MeasurementPage"
      "400":
        description:
          Les paramètres de période ou de pagination sont invalides, notamment si `size` dépasse
          100.
        content:
          application/problem+json:
            schema:
              $ref: "../components/schemas.yaml#/Problem"
            examples:
              erreur:
                $ref: "../components/examples.yaml#/BadRequest"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses.yaml#/Forbidden"
      "404":
        $ref: "../components/responses.yaml#/PatientNotFound"
    parameters:
      - $ref: "../components/parameters.yaml#/patientId"
      - $ref: "../components/parameters.yaml#/startDate"
      - $ref: "../components/parameters.yaml#/endDate"
      - $ref: "../components/parameters.yaml#/page"
      - $ref: "../components/parameters.yaml#/size"
