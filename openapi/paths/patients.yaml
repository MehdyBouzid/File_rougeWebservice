# GET /patients
collection:
  get:
    tags:
      - Patients
    operationId: listPatients
    summary: Afficher les patients suivis par le soignant connecté.
    description:
      Seuls les patients suivis par le soignant connecté sont accessibles.
      Le contrôle du consentement reste à valider pour cette opération.
    x-caller: soignant
    responses:
      "200":
        description: La liste paginée des patients suivis par le soignant connecté est récupérée.
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/PatientPage"
      "400":
        description:
          Les paramètres de pagination sont invalides ; la taille maximale documentée est de 100
          patients.
        content:
          application/problem+json:
            schema:
              $ref: "../components/schemas.yaml#/Problem"
            examples:
              erreur:
                $ref: "../components/examples.yaml#/BadRequest"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "403":
        description: L’appelant authentifié n’est pas autorisé à consulter la liste des patients.
        content:
          application/problem+json:
            schema:
              $ref: "../components/schemas.yaml#/Problem"
            examples:
              erreur:
                $ref: "../components/examples.yaml#/Forbidden"
    parameters:
      - $ref: "../components/parameters.yaml#/page"
      - $ref: "../components/parameters.yaml#/size"

# GET /patients/{patientId}
item:
  get:
    tags:
      - Patients
    operationId: getPatient
    summary: Consulter les informations d’un patient suivi.
    description:
      Le soignant doit suivre le patient et disposer des autorisations nécessaires.
      Le contrôle du consentement reste à valider pour cette opération.
    x-caller: soignant
    responses:
      "200":
        description: Les informations du patient suivi sont récupérées.
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/Patient"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "403":
        description:
          Le soignant ne suit pas le patient ou n’a pas les autorisations nécessaires pour
          consulter ses informations.
        content:
          application/problem+json:
            schema:
              $ref: "../components/schemas.yaml#/Problem"
            examples:
              erreur:
                $ref: "../components/examples.yaml#/Forbidden"
      "404":
        $ref: "../components/responses.yaml#/PatientNotFound"
    parameters:
      - $ref: "../components/parameters.yaml#/patientId"
