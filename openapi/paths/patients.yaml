# GET /patients
collection:
  get:
    tags:
      - Patients
    operationId: listPatients
    summary: Afficher les patients suivis par le soignant connecté.
    description:
      Scope soignant requis (403 sinon). La collection ne contient que les patients accessibles au
      soignant connecté ; un patient non suivi n’apparaît jamais. Le contrôle du consentement reste
      à valider ; s’il est retenu, les patients sans consentement valide sont aussi exclus.
    x-caller: soignant
    security:
      - bearerAuth: [soignant]
    responses:
      "200":
        description: La liste paginée des patients suivis par le soignant connecté est récupérée.
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/PatientPage"
      "400":
        description:
          Les paramètres de pagination sont invalides ; la taille maximale documentée est de 100
          patients.
        content:
          application/problem+json:
            schema:
              $ref: "../components/schemas.yaml#/Problem"
            examples:
              erreur:
                $ref: "../components/examples.yaml#/BadRequest"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses.yaml#/Forbidden"
    parameters:
      - $ref: "../components/parameters.yaml#/page"
      - $ref: "../components/parameters.yaml#/size"

# GET /patients/{patientId}
item:
  get:
    tags:
      - Patients
    operationId: getPatient
    summary: Consulter les informations d’un patient suivi.
    description:
      Scope soignant requis (403 sinon). Le patient doit exister et être suivi par le soignant ;
      sinon 404, sans distinguer les deux cas (BOLA). Le contrôle du consentement reste à valider ;
      s’il est retenu, son absence ou son retrait renvoie aussi 404.
    x-caller: soignant
    security:
      - bearerAuth: [soignant]
    responses:
      "200":
        description: Les informations du patient suivi sont récupérées.
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/Patient"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses.yaml#/Forbidden"
      "404":
        $ref: "../components/responses.yaml#/PatientNotFound"
    parameters:
      - $ref: "../components/parameters.yaml#/patientId"
