# GET /alerts
collection:
  get:
    tags:
      - Alertes
    operationId: listAlerts
    summary: Afficher les alertes des patients suivis, qu’elles soient actives ou déjà traitées.
    description:
      Scope soignant requis (403 sinon). La collection ne contient que les alertes accessibles au
      soignant connecté, quels que soient les filtres, car un filtre patientId sur un patient inexistant
      ou non accessible donne une liste vide en 200, jamais 403 ni 404. Le contrôle du consentement
      reste à valider ; s’il est retenu, les alertes sans consentement valide sont aussi exclues.
    x-caller: soignant
    security:
      - bearerAuth: [soignant]
    responses:
      "200":
        description:
          Les alertes des patients suivis sont récupérées selon les filtres et la pagination
          demandés. Chaque élément est décrit par AlertSummary ; l’enveloppe paginée reste ouverte.
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/AlertPage"
      "400":
        description:
          Les filtres ou les paramètres de pagination sont invalides ; la taille maximale
          documentée est de 100 alertes.
        content:
          application/problem+json:
            schema:
              $ref: "../components/schemas.yaml#/Problem"
            examples:
              erreur:
                $ref: "../components/examples.yaml#/BadRequest"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses.yaml#/Forbidden"
    parameters:
      - $ref: "../components/parameters.yaml#/patientFilter"
      - $ref: "../components/parameters.yaml#/status"
      - $ref: "../components/parameters.yaml#/startDate"
      - $ref: "../components/parameters.yaml#/endDate"
      - $ref: "../components/parameters.yaml#/page"
      - $ref: "../components/parameters.yaml#/size"

# GET et PATCH /alerts/{alertId}
item:
  get:
    tags:
      - Alertes
    operationId: getAlert
    summary:
      Consulter les détails d’une alerte pour identifier le patient concerné et la mesure qui l’a
      déclenchée.
    description:
      Scope soignant requis (403 sinon). L’alerte doit exister, concerner un patient suivi par le
      soignant et être couverte par un consentement valide ; sinon 404, sans distinguer les cas (BOLA).
    x-caller: soignant
    security:
      - bearerAuth: [soignant]
    responses:
      "200":
        description: Les détails de l’alerte demandée sont récupérés.
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/AlertDetail"
            example:
              alertId: alerte-001
              patientId: patient-001
              typeMesure: FREQUENCE_CARDIAQUE
              valeurMesuree: 125
              valeurSeuil: 110
              statut: ACTIVE
              horodatage: "2026-11-20T10:00:00Z"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses.yaml#/Forbidden"
      "404":
        $ref: "../components/responses.yaml#/AlertNotFound"
    parameters:
      - $ref: "../components/parameters.yaml#/alertId"
  patch:
    tags:
      - Alertes
    operationId: acknowledgeAlert
    summary: Marquer une alerte comme traitée après sa prise en charge par le soignant.
    description:
      Seule la transition ACTIVE vers TRAITEE est prévue, sans réactivation.
      Les alertes traitées sont conservées dans l’historique.
      Scope soignant requis (403 sinon). L’alerte doit exister et concerner un patient suivi ;
      sinon 404 (BOLA, en écriture comme en lecture). Le contrôle du consentement reste à valider ;
      s’il est retenu, son absence renvoie aussi 404.
    x-caller: soignant
    security:
      - bearerAuth: [soignant]
    x-pending-decision: Préciser la frontière entre statut invalide (400) et transition interdite (409).
    responses:
      "200":
        description: L’alerte a été marquée `TRAITEE`.
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/AlertDetail"
            example:
              alertId: alerte-001
              patientId: patient-001
              typeMesure: FREQUENCE_CARDIAQUE
              valeurMesuree: 125
              valeurSeuil: 110
              statut: TRAITEE
              horodatage: "2026-11-20T10:00:00Z"
      "400":
        description: Le statut transmis est invalide ; la valeur de mise à jour prévue est `TRAITEE`.
        content:
          application/problem+json:
            schema:
              $ref: "../components/schemas.yaml#/Problem"
            examples:
              erreur:
                $ref: "../components/examples.yaml#/BadRequest"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses.yaml#/Forbidden"
      "404":
        $ref: "../components/responses.yaml#/AlertNotFound"
      "409":
        description: L’alerte est déjà traitée ou la transition de statut demandée est interdite.
        content:
          application/problem+json:
            schema:
              $ref: "../components/schemas.yaml#/Problem"
            examples:
              erreur:
                $ref: "../components/examples.yaml#/Conflict"
    parameters:
      - $ref: "../components/parameters.yaml#/alertId"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/schemas.yaml#/AlertUpdate"
          examples:
            fictif:
              summary: Acquitter une alerte
              value:
                statut: TRAITEE
