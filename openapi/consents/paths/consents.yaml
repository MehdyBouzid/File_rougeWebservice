collection:
  get:
    tags:
      - Consentements
    operationId: listMyConsents
    summary: Consulter les consentements donnés par le patient connecté.
    description: Scope patient requis (403 sinon). Les consentements sont ceux du patient identifié par
      son authentification ; la collection ne contient jamais ceux d’un autre patient.
    x-caller: patient
    security:
      - bearerAuth:
          - patient
    responses:
      "200":
        $ref: ../components/responses/responses.yaml#/listMyConsents200
      "401":
        $ref: ../../common/components/responses/responses.yaml#/Unauthorized
      "403":
        $ref: ../../common/components/responses/responses.yaml#/Forbidden
item:
  delete:
    tags:
      - Consentements
    operationId: withdrawConsent
    summary: Retirer un consentement précédemment donné pour mettre fin aux accès concernés.
    description: Le retrait conserve le consentement, sa trace et l’historique des données ; il empêche
      les accès futurs concernés. Scope patient requis (403 sinon). Un consentement inexistant ou
      appartenant à un autre patient renvoie 404, sans distinguer les deux cas (BOLA).
    x-caller: patient
    security:
      - bearerAuth:
          - patient
    x-pending-decision: Définir le comportement d’un retrait déjà effectué.
    responses:
      "204":
        $ref: ../components/responses/responses.yaml#/withdrawConsent204
      "401":
        $ref: ../../common/components/responses/responses.yaml#/Unauthorized
      "403":
        $ref: ../../common/components/responses/responses.yaml#/Forbidden
      "404":
        $ref: ../components/responses/responses.yaml#/withdrawConsent404
    parameters:
      - $ref: ../components/parameters/parameters.yaml#/consentId
