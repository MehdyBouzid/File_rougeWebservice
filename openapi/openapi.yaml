  /patients/me/consents:
    $ref: ./consents/paths/consents.yaml#/collection
  /patients/me/consents/{consentId}:
    $ref: ./consents/paths/consents.yaml#/item
  /patients/{patientId}/seuils:
    $ref: ./thresholds/paths/seuils.yaml#/collection
  /patients/{patientId}/seuils/{seuilId}:
    $ref: ./thresholds/paths/seuils.yaml#/item
