x-pending-decisions:
  # Formats JSON non validés.
  - "Formats JSON non encore définis, types des identifiants et enveloppes des listes : non contraints
    tant que non validés."
  - Formats des dates non encore définis, unités et bornes numériques des mesures,
    validations complémentaires, ordre de tri, bornes de période et corps de réponses définitifs.
  # Sécurité : la cible patientId est retenue ; ses autorisations restent à préciser.
  - Identification du simulateur et rattachement montre-patient pour patientId, fournisseur et
    flux OAuth, noms définitifs et granularité des scopes montre/patient/soignant (noms provisoires).
  - "Périmètre du consentement pour listes de patients/alertes, informations patient, seuils et
    acquittement. Principe retenu : s’il est exigé, son absence ou son retrait place l’objet hors du
    périmètre (404 en accès direct, exclusion dans les collections)."
  - "Seuils — ETag fort calculé sans colonne de version : algorithme exact, sérialisation canonique
    et gestion de If-Match: * à valider. ETag sur la collection des seuils non retenu."
  - "Sécurité — flux OAuth (authorizationCode avec PKCE, clientCredentials), URLs du fournisseur et
    déclaration de schéma oauth2 : non figés, voir docs/outillage-tp3.md."
  # Réponse de création du lot.
  - Corps JSON de confirmation du lot et URI canonique dans Location ; pas de nouvelle route inventée.
  # Alertes et notifications.
  - "Propositions à confirmer pour les alertes : valeurSeuil est la borne minimale ou maximale
    réellement franchie ; horodatage est la date de création de l’alerte."
  - Enveloppe paginée des alertes, acquittement individuel,
    destinataires des notifications.
  # Traitement et persistance.
  - Ordre et garanties entre persistance, évaluation des seuils et alertes ; intégration PostgreSQL.
