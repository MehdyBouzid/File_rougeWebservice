openapi: 3.1.0
info:
  title: API Veillo — TP3
  version: 0.1.0
  description: Contrat de travail fondé sur docs/design.md, docs/api.md et docs/api-review.md ;
    fonctionnalités métier non implémentées. Seuls les champs et contraintes documentés sont
    imposés. Les formats JSON non définis restent ouverts (voir x-pending-decisions). Les exemples
    d’erreur sont fictifs. Prism ne vérifie ni les autorisations, ni les transactions, ni la
    détection des doublons.
  contact:
    name: Équipe Veillo
servers:
  - url: http://localhost:3000
    description: Backend local prévu ; endpoints métier non implémentés
  - url: http://127.0.0.1:4010
    description: Mock Prism du contrat, sans logique métier
tags:
  - name: Mesures
    description: Ingestion et consultation des mesures fictives.
  - name: Patients
    description: Patients suivis par le soignant connecté.
  - name: Alertes
    description: Consultation et traitement des alertes.
  - name: Consentements
    description: Consentements du patient connecté.
  - name: Seuils
    description: Configuration des seuils des patients.
security:
  - bearerAuth: []
paths:
  /measurements:
    $ref: ./measurements/paths/measurements.yaml#/ingestion
  /patients/{patientId}/measurements:
    $ref: ./measurements/paths/measurements.yaml#/patientMeasurements
  /patients:
    $ref: ./patients/paths/patients.yaml#/collection
  /patients/{patientId}:
