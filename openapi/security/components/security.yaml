bearerAuth:
  type: http
  scheme: bearer
  bearerFormat: JWT
  description: Jeton d’accès JWT obtenu avec OAuth 2.0. Trois types de clients ont des scopes
    distincts, indiqués par opération dans `security` (rôles du schéma Bearer, au sens d’OpenAPI
    3.1) ; `montre` (simulateur, envoi des mesures), `patient` (consentements du patient connecté)
    et `soignant` (patients, mesures, alertes et seuils). 401 si le jeton est absent ou invalide ;
    403 si son scope ne couvre pas l’opération (BFLA) ; 404 si l’objet est inexistant ou hors du
    périmètre de l’appelant (BOLA). Un scope donne le droit d’appeler l’opération, pas l’accès à un
    patient précis. Les noms des scopes sont provisoires ; leur granularité, le fournisseur, le flux
    OAuth et le lien avec les entités métier restent à valider. Aucun flux OAuth n’est déclaré.
    Prism ne vérifie ni les signatures JWT, ni les scopes, ni les droits métier.
