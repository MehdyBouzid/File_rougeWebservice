patientId:
  name: patientId
  in: path
  required: true
  description: Identifiant de la ressource demandée.
  schema:
    $ref: "./schemas.yaml#/Identifier"
  example: "42"
alertId:
  name: alertId
  in: path
  required: true
  description: Identifiant de la ressource demandée.
  schema:
    $ref: "./schemas.yaml#/Identifier"
  example: "12"
seuilId:
  name: seuilId
  in: path
  required: true
  description: Identifiant de la ressource demandée.
  schema:
    $ref: "./schemas.yaml#/Identifier"
  example: "7"
consentId:
  name: consentId
  in: path
  required: true
  description: Identifiant de la ressource demandée.
  schema:
    $ref: "./schemas.yaml#/Identifier"
  example: "3"
startDate:
  name: startDate
  in: query
  required: false
  description: Début de période ; format, bornes et période par défaut à valider.
  schema:
    type: string
    description: Horodatage ; format et fuseau définitifs à valider. Les exemples utilisent ISO 8601 UTC.
  example: 2026-10-01T00:00:00Z
endDate:
  name: endDate
  in: query
  required: false
  description: Fin de période ; format, bornes et période par défaut à valider.
  schema:
    type: string
    description: Horodatage ; format et fuseau définitifs à valider. Les exemples utilisent ISO 8601 UTC.
  example: 2026-10-31T00:00:00Z
page:
  name: page
  in: query
  description: Numéro de page à partir de zéro.
  schema:
    type: integer
    minimum: 0
    default: 0
size:
  name: size
  in: query
  description: Nombre de résultats par page ; une valeur supérieure à 100 est refusée.
  schema:
    type: integer
    maximum: 100
    default: 50
patientFilter:
  name: patientId
  in: query
  description: Filtre facultatif sur un patient suivi.
  schema:
    $ref: "./schemas.yaml#/Identifier"
  example: "42"
status:
  name: status
  in: query
  description:
    Statut d’alerte ; nom de filtre repris de api.md, distinct du champ statut dans le
    corps PATCH.
  schema:
    $ref: "./schemas.yaml#/AlertStatus"
