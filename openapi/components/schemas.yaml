Identifier:
  description:
    Identifiant métier ; type, format et bornes restent à définir. Les exemples de
    paramètres ne fixent pas le type définitif.
Measurement:
  type: object
  properties:
    horodatage:
      type: string
      format: date-time
      description: Date et heure du relevé, avec un fuseau horaire.
    frequenceCardiaque:
      type: number
      description: Fréquence cardiaque relevée.
    spo2:
      type: number
      description: Saturation en oxygène relevée.
    pas:
      type: integer
      description: Nombre de pas depuis le relevé précédent, et non un compteur cumulé.
  required:
    - horodatage
    - frequenceCardiaque
    - spo2
    - pas
  description:
    Relevé fictif associé au patient du lot. Les unités et les bornes numériques restent
    à préciser ; aucune limite de valeur ni interdiction de champ supplémentaire n’est imposée ici.
# Retenu : un patient par lot, patientId, batchId et au moins un relevé.
MeasurementBatch:
  type: object
  properties:
    patientId:
      $ref: "#/Identifier"
    batchId:
      $ref: "#/Identifier"
    measurements:
      type: array
      minItems: 1
      items:
        $ref: "#/Measurement"
  required:
    - patientId
    - batchId
    - measurements
  description:
    Lot de mesures fictives associé à un patient. Enregistrement atomique ;
    tout batchId déjà reçu est refusé, contenu identique ou différent.
Patient:
  description:
    "Informations du patient : identifiant, nom, prénom et date de naissance. Structure
    JSON à définir."
MeasurementType:
  type: string
  enum:
    - FREQUENCE_CARDIAQUE
    - SPO2
    - PAS
  description:
    Type commun aux seuils et aux alertes. Correspond respectivement aux champs
    frequenceCardiaque, spo2 et pas des relevés ; pas compte les pas depuis le relevé précédent.
Threshold:
  type: object
  properties:
    seuilId:
      $ref: "#/Identifier"
    patientId:
      $ref: "#/Identifier"
    typeMesure:
      $ref: "#/MeasurementType"
    valeurMin:
      type: number
    valeurMax:
      type: number
    actif:
      type: boolean
      description: Le backend active automatiquement le seuil à sa création.
  required:
    - seuilId
    - patientId
    - typeMesure
    - valeurMin
    - valeurMax
    - actif
  description:
    Seuil du patient. Le backend garantit valeurMin <= valeurMax et un seul seuil actif
    par patient et type de mesure. Les types et formats des identifiants restent ouverts.
ThresholdCreate:
  type: object
  additionalProperties: false
  properties:
    typeMesure:
      $ref: "#/MeasurementType"
    valeurMin:
      type: number
    valeurMax:
      type: number
  required:
    - typeMesure
    - valeurMin
    - valeurMax
  description:
    Les trois propriétés sont obligatoires et non nulles ; les propriétés inconnues sont
    refusées. Le patient vient du chemin et actif est fixé à true par le backend.
    Le backend vérifie valeurMin <= valeurMax, égalité autorisée ; cette comparaison entre
    propriétés n’est pas exprimable par les contraintes JSON Schema standard utilisées ici.
ThresholdPatch:
  type: object
  additionalProperties: false
  minProperties: 1
  properties:
    valeurMin:
      type: number
    valeurMax:
      type: number
    actif:
      type: boolean
  description:
    Au moins une propriété est requise ; chacune est facultative individuellement.
    Corps vide, valeurs nulles et propriétés inconnues sont refusés. Le type de mesure
    et le patient ne sont pas modifiables. Après fusion avec les valeurs conservées,
    le backend vérifie valeurMin <= valeurMax ; cette comparaison n’est pas validée par le schéma.
AlertStatus:
  type: string
  enum:
    - ACTIVE
    - TRAITEE
AlertSummary:
  type: object
  properties:
    alertId:
      $ref: "#/Identifier"
    patientId:
      $ref: "#/Identifier"
    nomPatient:
      type: string
    prenomPatient:
      type: string
    typeMesure:
      $ref: "#/MeasurementType"
    horodatage:
      type: string
      format: date-time
      description: Horodatage de l’alerte ; l’interprétation comme date de création est proposée, à confirmer.
    statut:
      $ref: "#/AlertStatus"
  required:
    - alertId
    - patientId
    - nomPatient
    - prenomPatient
    - typeMesure
    - horodatage
    - statut
  description:
    Élément synthétique de GET /alerts, sans les valeurs mesurée et du seuil.
    L’enveloppe paginée qui contient ces éléments reste à définir dans AlertPage.
AlertDetail:
  type: object
  properties:
    alertId:
      $ref: "#/Identifier"
    patientId:
      $ref: "#/Identifier"
    typeMesure:
      $ref: "#/MeasurementType"
    valeurMesuree:
      type: number
      description: Valeur de la mesure ayant déclenché l’alerte.
    valeurSeuil:
      type: number
      description: Valeur du seuil déclenché ; la borne minimale ou maximale réellement franchie est proposée, à confirmer.
    statut:
      $ref: "#/AlertStatus"
    horodatage:
      type: string
      format: date-time
      description: Horodatage de l’alerte ; l’interprétation comme date de création est proposée, à confirmer.
  required:
    - alertId
    - patientId
    - typeMesure
    - valeurMesuree
    - valeurSeuil
    - statut
    - horodatage
  description:
    Détail retourné par GET /alerts/{alertId} et après acquittement par PATCH.
    Aucun identifiant de mesure ou de seuil n’est exposé. Les unités et bornes numériques
    restent ouvertes, ainsi que les interprétations proposées de valeurSeuil et horodatage.
AlertUpdate:
  type: object
  properties:
    statut:
      type: string
      enum:
        - TRAITEE
  required:
    - statut
  description: Seule la transition ACTIVE vers TRAITEE est prévue. Pas de réactivation.
Problem:
  type: object
  properties:
    type:
      type: string
      format: uri-reference
    title:
      type: string
    status:
      type: integer
      minimum: 100
      maximum: 599
    detail:
      type: string
    instance:
      type: string
      format: uri-reference
  required:
    - type
    - title
    - status
  description:
    Erreur application/problem+json. Aucun détail sensible dans les messages. Les exemples
    sont fictifs.
BatchReceipt:
  description: "Corps de confirmation de création du lot : contenu et structure JSON non définis."
MeasurementPage:
  description:
    Mesures et informations de pagination (page actuelle, taille et nombre total de pages).
    Enveloppe et noms des champs JSON non définis ; aucun items, page, size ou totalPages imposé
    dans la réponse.
PatientPage:
  description: Patients suivis et informations de pagination. Structure JSON et noms des champs non définis.
AlertPage:
  description:
    Liste paginée d’éléments décrits par AlertSummary (alertId, patientId, nomPatient,
    prenomPatient, typeMesure, horodatage et statut). L’enveloppe JSON et les noms des
    métadonnées de pagination restent ouverts ; ce schéma ne contraint pas encore leur structure.
ConsentList:
  description:
    "Consentements du patient connecté : identifiant, soignant, dates et état. Format de
    liste, valeurs de l’état, présence et nullabilité de la date de fin à définir."
ThresholdList:
  description:
    Liste de seuils du patient dont chaque élément est décrit par Threshold.
    L’enveloppe JSON reste à définir ; ce schéma ne contraint pas encore la structure de la liste.
