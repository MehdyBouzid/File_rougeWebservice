# Composants OpenAPI du cache HTTP et des requêtes conditionnelles (seuils).
# Organisation : une section par type de composant, comme dans components/ du parent.
# Références : cache.yaml#/headers/..., #/parameters/..., #/responses/..., #/examples/...
headers:
  ETag:
    description:
      Validateur fort de la représentation du seuil, calculé par le backend à partir de sa
      représentation complète. Valeur opaque entre guillemets, à renvoyer telle quelle dans
      If-Match ou If-None-Match ; le client ne doit pas l’interpréter.
    required: true
    schema:
      type: string
    example: '"4b1f0c9e7a3d2e58"'
parameters:
  ifMatch:
    name: If-Match
    in: header
    required: false
    description:
      ETag du seuil lu précédemment. Exigé par le backend ; son absence donne 428 et une valeur qui
      ne correspond plus à l’état courant donne 412. Déclaré facultatif ici pour que 428 reste
      atteignable, sinon un outil de validation rejetterait la requête avant le backend.
    schema:
      type: string
    example: '"4b1f0c9e7a3d2e58"'
  ifNoneMatch:
    name: If-None-Match
    in: header
    required: false
    description:
      ETag déjà détenu par le client. S’il correspond à l’état courant, la réponse est 304 sans
      corps (comparaison faible, RFC 9110).
    schema:
      type: string
    example: '"4b1f0c9e7a3d2e58"'
responses:
  PreconditionFailed:
    description:
      If-Match ne correspond pas à l’ETag courant du seuil, car il a été modifié depuis sa lecture.
      Le client relit le seuil (GET) avant de réessayer. Évaluée après 401, 403, 404 et 428.
    content:
      application/problem+json:
        schema:
          $ref: "./schemas.yaml#/Problem"
        examples:
          erreur:
            $ref: "#/examples/PreconditionFailed"
  PreconditionRequired:
    description:
      L’en-tête If-Match est absent alors que la modification du seuil l’exige. Évaluée après 401,
      403 et 404, avant 412.
    content:
      application/problem+json:
        schema:
          $ref: "./schemas.yaml#/Problem"
        examples:
          erreur:
            $ref: "#/examples/PreconditionRequired"
  NotModified:
    description:
      Le seuil n’a pas changé depuis l’ETag fourni dans If-None-Match ; aucun corps n’est renvoyé.
      L’ETag est répété dans la réponse.
    headers:
      ETag:
        $ref: "#/headers/ETag"
examples:
  PreconditionFailed:
    summary: Réponse d’erreur illustrative
    value:
      type: about:blank
      title: Précondition non satisfaite
      status: 412
      detail: Le seuil a été modifié depuis sa lecture. Exemple fictif sans donnée de santé.
  PreconditionRequired:
    summary: Réponse d’erreur illustrative
    value:
      type: about:blank
      title: Précondition requise
      status: 428
      detail: L’en-tête If-Match est obligatoire. Exemple fictif sans donnée de santé.
