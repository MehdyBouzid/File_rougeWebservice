x-pending-decisions:
  - 'Formats JSON, noms des champs, types des identifiants et enveloppes des listes : non contraints tant que non validés.'
  - Formats des dates, unités, validation des valeurs, ordre de tri, bornes de période et corps de réponses définitifs.
  - Identification du simulateur et autorisation pour le patient indiqué par patientId, fournisseur et flux OAuth, noms des scopes.
  - Périmètre du consentement pour listes de patients/alertes, informations patient, seuils et acquittement.
  - Corps JSON de confirmation du lot et URI canonique dans Location ; pas de nouvelle route inventée.
  - Signification de valeur_seuil, acquittement individuel, destinataires des notifications.
  - Ordre et garanties entre persistance, évaluation des seuils et alertes ; intégration PostgreSQL.
