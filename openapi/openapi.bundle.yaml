openapi: 3.1.0
info:
  title: API Veillo — TP3
  version: 0.1.0
  description: Contrat de travail fondé sur docs/design.md, docs/api.md et docs/api-review.md ; fonctionnalités métier non implémentées. Seuls les champs et contraintes documentés sont imposés. Les formats JSON non définis restent ouverts (voir x-pending-decisions). Les exemples d’erreur sont fictifs. Prism ne vérifie ni les autorisations, ni les transactions, ni la détection des doublons.
  contact:
    name: Équipe Veillo
servers:
  - url: http://localhost:3000
    description: Backend local prévu ; endpoints métier non implémentés
  - url: http://127.0.0.1:4010
    description: Mock Prism du contrat, sans logique métier
security:
  - bearerAuth: []
tags:
  - name: Mesures
    description: Ingestion et consultation des mesures fictives.
  - name: Patients
    description: Patients suivis par le soignant connecté.
  - name: Alertes
    description: Consultation et traitement des alertes.
  - name: Consentements
    description: Consentements du patient connecté.
  - name: Seuils
    description: Configuration des seuils des patients.
paths:
  /measurements:
    post:
      tags:
        - Mesures
      operationId: ingestMeasurements
      summary: Enregistrer les mesures envoyées par les montres connectées pour assurer le suivi des patients.
      description: Le simulateur transmet un lot pour le patient indiqué par patientId ; l’émetteur authentifié doit être autorisé à transmettre pour ce patient. Un relevé invalide entraîne le rejet complet du lot ; l’enregistrement est atomique. Tout batchId existant entraîne 409, contenu identique ou différent. L’évaluation des seuils suit l’enregistrement dans le parcours décrit ; l’ordre technique et ses garanties restent à valider.
      x-caller: simulateur
      responses:
        '201':
          description: Le lot a été validé et enregistré avec toutes ses mesures dans une transaction.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchReceipt'
          headers:
            Location:
              description: URI du lot créé. Convention non définie dans les documents ; aucune route de consultation des lots n’est ajoutée.
              required: true
              schema:
                type: string
                format: uri-reference
              x-pending-decision: Définir l’URI canonique du lot créé pour renseigner Location.
        '400':
          description: Les données du lot sont invalides ; un seul relevé invalide entraîne le rejet du lot entier.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                erreur:
                  $ref: '#/components/examples/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: L’appelant authentifié n’est pas autorisé à transmettre les mesures.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                erreur:
                  $ref: '#/components/examples/Forbidden'
        '409':
          description: Le `batchId` a déjà été utilisé, que le contenu soit identique ou différent ; aucune nouvelle mesure n’est enregistrée.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                erreur:
                  $ref: '#/components/examples/Conflict'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MeasurementBatch'
  /patients/{patientId}/measurements:
    get:
      tags:
        - Mesures
      operationId: listPatientMeasurements
      summary: Récupérer les mesures d’un patient sur une période donnée pour suivre leur évolution.
      description: Le soignant doit suivre le patient et disposer des autorisations nécessaires et d’un consentement valide.
      x-caller: soignant
      responses:
        '200':
          description: Les mesures du patient correspondant à la période et à la page demandées sont récupérées.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeasurementPage'
        '400':
          description: Les paramètres de période ou de pagination sont invalides, notamment si `size` dépasse 100.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                erreur:
                  $ref: '#/components/examples/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Le soignant n’a pas les autorisations nécessaires, ne suit pas le patient ou ne dispose pas d’un consentement valide.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                erreur:
                  $ref: '#/components/examples/Forbidden'
        '404':
          $ref: '#/components/responses/PatientNotFound'
      parameters:
        - $ref: '#/components/parameters/patientId'
        - $ref: '#/components/parameters/startDate'
        - $ref: '#/components/parameters/endDate'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/size'
  /patients:
    get:
      tags:
        - Patients
      operationId: listPatients
      summary: Afficher les patients suivis par le soignant connecté.
      description: Seuls les patients suivis par le soignant connecté sont accessibles. Le contrôle du consentement reste à valider pour cette opération.
      x-caller: soignant
      responses:
        '200':
          description: La liste paginée des patients suivis par le soignant connecté est récupérée.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientPage'
        '400':
          description: Les paramètres de pagination sont invalides ; la taille maximale documentée est de 100 patients.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                erreur:
                  $ref: '#/components/examples/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: L’appelant authentifié n’est pas autorisé à consulter la liste des patients.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                erreur:
                  $ref: '#/components/examples/Forbidden'
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/size'
  /patients/{patientId}:
    get:
      tags:
        - Patients
      operationId: getPatient
      summary: Consulter les informations d’un patient suivi.
      description: Le soignant doit suivre le patient et disposer des autorisations nécessaires. Le contrôle du consentement reste à valider pour cette opération.
      x-caller: soignant
      responses:
        '200':
          description: Les informations du patient suivi sont récupérées.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Patient'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Le soignant ne suit pas le patient ou n’a pas les autorisations nécessaires pour consulter ses informations.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                erreur:
                  $ref: '#/components/examples/Forbidden'
        '404':
          $ref: '#/components/responses/PatientNotFound'
      parameters:
        - $ref: '#/components/parameters/patientId'
  /alerts:
    get:
      tags:
        - Alertes
      operationId: listAlerts
      summary: Afficher les alertes des patients suivis, qu’elles soient actives ou déjà traitées.
      description: Les alertes concernent uniquement les patients suivis par le soignant connecté. Le contrôle du consentement reste à valider pour cette opération.
      x-caller: soignant
      responses:
        '200':
          description: Les alertes des patients suivis sont récupérées selon les filtres et la pagination demandés.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertPage'
        '400':
          description: Les filtres ou les paramètres de pagination sont invalides ; la taille maximale documentée est de 100 alertes.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                erreur:
                  $ref: '#/components/examples/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: L’appelant authentifié n’est pas autorisé à consulter les alertes.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                erreur:
                  $ref: '#/components/examples/Forbidden'
      parameters:
        - $ref: '#/components/parameters/patientFilter'
        - $ref: '#/components/parameters/status'
        - $ref: '#/components/parameters/startDate'
        - $ref: '#/components/parameters/endDate'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/size'
  /alerts/{alertId}:
    get:
      tags:
        - Alertes
      operationId: getAlert
      summary: Consulter les détails d’une alerte pour identifier le patient concerné et la mesure qui l’a déclenchée.
      description: Le soignant doit suivre le patient et disposer des autorisations nécessaires et d’un consentement valide.
      x-caller: soignant
      responses:
        '200':
          description: Les détails de l’alerte demandée sont récupérés.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Le soignant ne suit pas le patient concerné, n’a pas les autorisations nécessaires ou ne dispose pas d’un consentement valide.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                erreur:
                  $ref: '#/components/examples/Forbidden'
        '404':
          $ref: '#/components/responses/AlertNotFound'
      parameters:
        - $ref: '#/components/parameters/alertId'
    patch:
      tags:
        - Alertes
      operationId: acknowledgeAlert
      summary: Marquer une alerte comme traitée après sa prise en charge par le soignant.
      description: Seule la transition ACTIVE vers TRAITEE est prévue, sans réactivation. Les alertes traitées sont conservées dans l’historique. Le soignant doit suivre le patient ; le contrôle du consentement reste à valider.
      x-caller: soignant
      x-pending-decision: Préciser la frontière entre statut invalide (400) et transition interdite (409).
      responses:
        '200':
          description: L’alerte a été marquée `TRAITEE`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertDetail'
        '400':
          description: Le statut transmis est invalide ; la valeur de mise à jour prévue est `TRAITEE`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                erreur:
                  $ref: '#/components/examples/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: L’appelant authentifié n’est pas autorisé à traiter cette alerte, notamment s’il ne suit pas le patient concerné.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                erreur:
                  $ref: '#/components/examples/Forbidden'
        '404':
          $ref: '#/components/responses/AlertNotFound'
        '409':
          description: L’alerte est déjà traitée ou la transition de statut demandée est interdite.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                erreur:
                  $ref: '#/components/examples/Conflict'
      parameters:
        - $ref: '#/components/parameters/alertId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertUpdate'
            examples:
              fictif:
                summary: Exemple fictif de travail, format à valider
                value:
                  statut: TRAITEE
  /patients/me/consents:
    get:
      tags:
        - Consentements
      operationId: listMyConsents
      summary: Consulter les consentements donnés par le patient connecté.
      description: Les consentements sont ceux du patient identifié par son authentification.
      x-caller: patient
      responses:
        '200':
          description: Les consentements du patient identifié par son authentification sont récupérés.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: L’appelant authentifié n’est pas autorisé à consulter les consentements en tant que patient.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                erreur:
                  $ref: '#/components/examples/Forbidden'
  /patients/me/consents/{consentId}:
    delete:
      tags:
        - Consentements
      operationId: withdrawConsent
      summary: Retirer un consentement précédemment donné pour mettre fin aux accès concernés.
      description: Le retrait conserve le consentement, sa trace et l’historique des données ; il empêche les accès futurs concernés. 403 si le consentement appartient à un autre patient ; 404 s’il est introuvable.
      x-caller: patient
      x-pending-decision: Définir le comportement d’un retrait déjà effectué.
      responses:
        '204':
          description: Le retrait du consentement appartenant au patient connecté est enregistré ; la réponse ne contient pas de corps.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Le consentement existe mais appartient à un autre patient.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                erreur:
                  $ref: '#/components/examples/Forbidden'
        '404':
          description: Le consentement demandé est introuvable.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                erreur:
                  $ref: '#/components/examples/NotFound'
      parameters:
        - $ref: '#/components/parameters/consentId'
  /patients/{patientId}/seuils:
    get:
      tags:
        - Seuils
      operationId: listPatientThresholds
      summary: Consulter les seuils configurés pour surveiller les mesures d’un patient.
      description: Le soignant doit suivre le patient et disposer des autorisations nécessaires. Le contrôle du consentement reste à valider pour cette opération.
      x-caller: soignant
      responses:
        '200':
          description: Les seuils configurés pour le patient sont récupérés.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThresholdList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Le soignant ne suit pas le patient ou n’a pas les autorisations nécessaires pour consulter ses seuils.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                erreur:
                  $ref: '#/components/examples/Forbidden'
        '404':
          $ref: '#/components/responses/PatientNotFound'
      parameters:
        - $ref: '#/components/parameters/patientId'
    post:
      tags:
        - Seuils
      operationId: createPatientThreshold
      summary: Créer un seuil définissant les limites qui déclenchent des alertes pour les mesures d’un patient.
      description: Un seul seuil actif est autorisé par patient et type de mesure. Le soignant doit suivre le patient ; le contrôle du consentement reste à valider.
      x-caller: soignant
      responses:
        '201':
          description: Le nouveau seuil du patient a été enregistré.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Threshold'
          headers:
            Location:
              description: URI identifiant la ressource créée.
              required: true
              schema:
                type: string
                format: uri-reference
              example: /patients/42/seuils/7
        '400':
          description: Les données du seuil sont invalides ; les critères précis de validation restent à définir.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                erreur:
                  $ref: '#/components/examples/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Le soignant ne suit pas le patient ou n’a pas les autorisations nécessaires pour créer un seuil.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                erreur:
                  $ref: '#/components/examples/Forbidden'
        '404':
          $ref: '#/components/responses/PatientNotFound'
        '409':
          description: Un seuil actif du même type existe déjà pour ce patient ; la création est refusée.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                erreur:
                  $ref: '#/components/examples/Conflict'
      parameters:
        - $ref: '#/components/parameters/patientId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ThresholdCreate'
  /patients/{patientId}/seuils/{seuilId}:
    patch:
      tags:
        - Seuils
      operationId: updatePatientThreshold
      summary: Adapter les valeurs d’un seuil ou l’activer ou le désactiver pour ajuster la surveillance du patient.
      description: Un seul seuil actif est autorisé par patient et type de mesure. La désactivation conserve le seuil. Le soignant doit suivre le patient ; le contrôle du consentement reste à valider.
      x-caller: soignant
      responses:
        '200':
          description: Les valeurs ou l’état du seuil ont été modifiés.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Threshold'
        '400':
          description: Les nouvelles données du seuil sont invalides ; les critères précis de validation restent à définir.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                erreur:
                  $ref: '#/components/examples/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Le soignant n’a pas les autorisations nécessaires ou ne suit pas le patient. Le seuil doit également appartenir au patient indiqué ; le code de refus pour une discordance reste à valider.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                erreur:
                  $ref: '#/components/examples/Forbidden'
        '404':
          description: Le patient ou le seuil demandé est introuvable.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                erreur:
                  $ref: '#/components/examples/NotFound'
        '409':
          description: L’activation entrerait en conflit avec un autre seuil actif du même type pour ce patient.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                erreur:
                  $ref: '#/components/examples/Conflict'
      parameters:
        - $ref: '#/components/parameters/patientId'
        - $ref: '#/components/parameters/seuilId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ThresholdPatch'
components:
  responses:
    Unauthorized:
      description: L’authentification de l’appelant est invalide ; aucun appelant authentifié ne peut être établi.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            erreur:
              $ref: '#/components/examples/Unauthorized'
      headers:
        WWW-Authenticate:
          description: Challenge Bearer ; détails à préciser avec le fournisseur OAuth.
          schema:
            type: string
          example: Bearer
    PatientNotFound:
      description: Le patient demandé est introuvable.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            erreur:
              $ref: '#/components/examples/NotFound'
    AlertNotFound:
      description: L’alerte demandée est introuvable.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            erreur:
              $ref: '#/components/examples/NotFound'
  examples:
    BadRequest:
      summary: Réponse d’erreur illustrative
      value:
        type: about:blank
        title: Données invalides
        status: 400
        detail: Données invalides. Exemple fictif sans donnée de santé.
    Unauthorized:
      summary: Réponse d’erreur illustrative
      value:
        type: about:blank
        title: Authentification invalide
        status: 401
        detail: Authentification invalide. Exemple fictif sans donnée de santé.
    Forbidden:
      summary: Réponse d’erreur illustrative
      value:
        type: about:blank
        title: Accès refusé
        status: 403
        detail: Accès refusé. Exemple fictif sans donnée de santé.
    NotFound:
      summary: Réponse d’erreur illustrative
      value:
        type: about:blank
        title: Ressource introuvable
        status: 404
        detail: Ressource introuvable. Exemple fictif sans donnée de santé.
    Conflict:
      summary: Réponse d’erreur illustrative
      value:
        type: about:blank
        title: Conflit métier
        status: 409
        detail: Conflit métier. Exemple fictif sans donnée de santé.
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Jeton d’accès JWT obtenu avec OAuth 2.0. Fournisseur, flux, noms des scopes distincts montre/patient/soignant et lien avec les entités métier restent à valider. Aucun flux OAuth ni scope fictif n’est déclaré. Prism ne vérifie pas les signatures JWT ou les droits métier.
  parameters:
    patientId:
      name: patientId
      in: path
      required: true
      description: Identifiant de la ressource demandée.
      schema:
        $ref: '#/components/schemas/Identifier'
      example: '42'
    alertId:
      name: alertId
      in: path
      required: true
      description: Identifiant de la ressource demandée.
      schema:
        $ref: '#/components/schemas/Identifier'
      example: '12'
    seuilId:
      name: seuilId
      in: path
      required: true
      description: Identifiant de la ressource demandée.
      schema:
        $ref: '#/components/schemas/Identifier'
      example: '7'
    consentId:
      name: consentId
      in: path
      required: true
      description: Identifiant de la ressource demandée.
      schema:
        $ref: '#/components/schemas/Identifier'
      example: '3'
    startDate:
      name: startDate
      in: query
      required: false
      description: Début de période ; format, bornes et période par défaut à valider.
      schema:
        type: string
        description: Horodatage ; format et fuseau définitifs à valider. Les exemples utilisent ISO 8601 UTC.
      example: '2026-10-01T00:00:00Z'
    endDate:
      name: endDate
      in: query
      required: false
      description: Fin de période ; format, bornes et période par défaut à valider.
      schema:
        type: string
        description: Horodatage ; format et fuseau définitifs à valider. Les exemples utilisent ISO 8601 UTC.
      example: '2026-10-31T00:00:00Z'
    page:
      name: page
      in: query
      description: Numéro de page à partir de zéro.
      schema:
        type: integer
        minimum: 0
        default: 0
    size:
      name: size
      in: query
      description: Nombre de résultats par page ; une valeur supérieure à 100 est refusée.
      schema:
        type: integer
        maximum: 100
        default: 50
    patientFilter:
      name: patientId
      in: query
      description: Filtre facultatif sur un patient suivi.
      schema:
        $ref: '#/components/schemas/Identifier'
      example: '42'
    status:
      name: status
      in: query
      description: Statut d’alerte ; nom de filtre repris de api.md, distinct du champ statut dans le corps PATCH.
      schema:
        $ref: '#/components/schemas/AlertStatus'
  schemas:
    Identifier:
      description: Identifiant métier ; type, format et bornes restent à définir. Les exemples de paramètres ne fixent pas le type définitif.
    Measurement:
      type: object
      description: 'Un relevé contient un horodatage, une fréquence cardiaque, une SpO₂ et un nombre de pas. Noms JSON, types précis, unités et validation restant à définir : aucune propriété JSON imposée.'
    MeasurementBatch:
      type: object
      properties:
        patientId:
          $ref: '#/components/schemas/Identifier'
        batchId:
          $ref: '#/components/schemas/Identifier'
        measurements:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Measurement'
      required:
        - patientId
        - batchId
        - measurements
      description: Lot de mesures fictives associé à un patient. Enregistrement atomique ; tout batchId déjà reçu est refusé, contenu identique ou différent.
    Patient:
      description: 'Informations du patient : identifiant, nom, prénom et date de naissance. Structure JSON à définir.'
    Threshold:
