Identifier:
  description: Identifiant métier ; type, format et bornes restent à définir. Les exemples de
    paramètres ne fixent pas le type définitif.
MeasurementType:
  type: string
  enum:
    - FREQUENCE_CARDIAQUE
    - SPO2
    - PAS
  description: Type commun aux seuils et aux alertes. Correspond respectivement aux champs
    frequenceCardiaque, spo2 et pas des relevés ; pas compte les pas depuis le relevé précédent.
Problem:
  type: object
  properties:
    type:
      type: string
      format: uri-reference
    title:
      type: string
    status:
      type: integer
      minimum: 100
      maximum: 599
    detail:
      type: string
    instance:
      type: string
      format: uri-reference
  required:
    - type
    - title
    - status
  description: Erreur application/problem+json. Aucun détail sensible dans les messages. Les exemples
    sont fictifs.
