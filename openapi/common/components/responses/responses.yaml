Unauthorized:
  description: Authentification absente ou invalide ; aucun appelant authentifié ne peut être établi.
  content:
    application/problem+json:
      schema:
        $ref: ../schemas/schemas.yaml#/Problem
      examples:
        erreur:
          $ref: ../examples/examples.yaml#/Unauthorized
  headers:
    WWW-Authenticate:
      description: Challenge Bearer ; détails à préciser avec le fournisseur OAuth.
      required: true
      schema:
        type: string
      example: Bearer
Forbidden:
  description: Appelant authentifié dont le rôle ou les scopes ne permettent pas cette opération
    (BFLA), par exemple un jeton de montre ou de patient sur une opération réservée aux soignants.
    Ce code ne traduit jamais l’appartenance d’un objet, car un objet hors du périmètre de
    l’appelant renvoie 404.
  content:
    application/problem+json:
      schema:
        $ref: ../schemas/schemas.yaml#/Problem
      examples:
        erreur:
          $ref: ../examples/examples.yaml#/Forbidden
PatientNotFound:
  description: Patient inexistant ou hors du périmètre autorisé de l’appelant (BOLA), notamment s’il
    n’est pas suivi par le soignant ou si le consentement valide exigé est absent ou retiré. Les cas
    ne sont pas distinguables dans la réponse.
  content:
    application/problem+json:
      schema:
        $ref: ../schemas/schemas.yaml#/Problem
      examples:
        erreur:
          $ref: ../examples/examples.yaml#/NotFound
